<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 39 Practice Quiz 2</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 39 Practice Quiz 2</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData =[
            // --- Section 1: Pathology of the Liver ---
            {
                section: "Pathology of the Liver",
                fullLO: "LO1: Recognize laboratory and histologic signs of hepatic injury.",
                question: "A 55-year-old man with chronic liver disease is being evaluated for signs of worsening hepatic function. His physician orders a panel of laboratory tests to evaluate the synthetic capacity of his liver. Which of the following tests is a direct measure of hepatocyte synthetic function?",
                options: {
                    A: "Aspartate aminotransferase (AST)",
                    B: "Prothrombin time (PT)",
                    C: "Serum alkaline phosphatase",
                    D: "Serum ammonia",
                    E: "Serum lactate dehydrogenase (LDH)"
                },
                correctAnswer: "B",
                rationale: "The synthetic function of hepatocytes is evaluated by measuring proteins secreted into the blood, specifically serum albumin and coagulation factors. Coagulation factors are assessed using Prothrombin time (PT) and partial thromboplastin (PTT) times. AST, ALT, and LDH measure hepatocyte integrity (injury), while alkaline phosphatase evaluates biliary excretory function.",
                source: "Pathology of the Liver PDF, Slide 9: 'Hepatocyte synthetic function... Coagulation factors: Prothrombin (PT) and partial thromboplastin (PTT) times'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO1: Recognize laboratory and histologic signs of hepatic injury.",
                question: "A 45-year-old woman undergoes a liver biopsy for persistently elevated liver enzymes. Microscopic examination of the tissue reveals scattered hepatocytes that are significantly enlarged with empty, pale cytoplasm. Which of the following terms best describes this specific histologic finding?",
                options: {
                    A: "Ballooning degeneration",
                    B: "Cholestasis",
                    C: "Councilman body formation",
                    D: "Macrovesicular steatosis",
                    E: "Microvesicular steatosis"
                },
                correctAnswer: "A",
                rationale: "Ballooning degeneration is a histologic sign of hepatocyte injury characterized by enlarged cells with empty, pale cytoplasm.",
                source: "Pathology of the Liver PDF, Slide 10: 'Hepatocyte Injury • Ballooning degeneration • Enlarged cells with empty pale cytoplasm'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO2: Discuss the clinical presentation of acute versus chronic liver failure.",
                question: "A 30-year-old woman is brought to the emergency department after an intentional overdose of an unknown medication. She has no prior medical history. Within 4 days, she develops severe jaundice, hepatic encephalopathy, and a coagulopathy with an INR of 2.1. A liver biopsy would most likely show which of the following histologic patterns?",
                options: {
                    A: "Advanced bridging fibrosis",
                    B: "Cellular necrosis and apoptosis",
                    C: "Dense fibrous bands encircling nodules",
                    D: "Regenerative nodules of hepatocytes",
                    E: "Widespread portal-portal septal fibrosis"
                },
                correctAnswer: "B",
                rationale: "This patient is presenting with acute (fulminant) liver failure (rapid development within days to weeks, encephalopathy, coagulopathy, no preceding cirrhosis). The histologic hallmark of acute liver failure is massive cellular necrosis and apoptosis, not the fibrotic/cirrhotic changes seen in chronic failure.",
                source: "Pathology of the Liver PDF, Slide 17: 'Acute: develops rapidly days or weeks (fulminant)... No preceding cirrhosis • Histology • Cellular necrosis / apoptosis'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO2: Discuss the clinical presentation of acute versus chronic liver failure.",
                question: "A 62-year-old man with a 20-year history of heavy alcohol use presents to the clinic with new-onset confusion and a flapping tremor of his hands (asterixis). Physical examination reveals spider angiomata, palmar erythema, and gynecomastia. The insidious onset of his hepatic encephalopathy over months to years is most closely associated with which of the following underlying histologic features?",
                options: {
                    A: "Advanced fibrosis and cirrhosis",
                    B: "Diffuse acute lobular inflammation",
                    C: "Florid duct lesions",
                    D: "Microvesicular steatosis",
                    E: "Widespread hepatocyte cytolysis (\"ghost cells\")"
                },
                correctAnswer: "A",
                rationale: "Chronic liver failure develops insidiously over months to years and frequently occurs in the setting of cirrhosis. Patients exhibit features of acute failure plus additional stigmata of cirrhosis (spider angiomata, gynecomastia). The defining histology is advanced fibrosis/cirrhosis.",
                source: "Pathology of the Liver PDF, Slide 17: 'Chronic: Insidiously months to years • Clinical • Frequently occurs in the setting of cirrhosis... Histology • Advanced fibrosis / cirrhosis'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Viral Hepatitis).",
                question: "A 40-year-old man with a known history of Hepatitis C virus (HCV) infection undergoes a liver biopsy to stage his disease. Which of the following histologic findings is most characteristic of the chronic phase of this infection?",
                options: {
                    A: "Dense mononuclear portal infiltrates spilling into the parenchyma",
                    B: "Ground-glass hepatocytes",
                    C: "Massive centrilobular coagulative necrosis",
                    D: "Onion-skinning fibrosis around bile ducts",
                    E: "Prominent plasma cell infiltrates"
                },
                correctAnswer: "A",
                rationale: "Chronic viral hepatitis is histologically characterized by dense mononuclear portal infiltrates (lymphocytes) and interface hepatitis, where inflammation spills over into the liver parenchyma.",
                source: "Pathology of the Liver PDF, Slide 24: 'Viral Hepatitis Chronic Phase... Dense mononuclear portal infiltrates (lymphocytes) • Defining lesion of chronic hepatitis • Interface hepatitis • Inflammation spills over into the liver parenchyma'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Toxic Injury - Acetaminophen).",
                question: "A 22-year-old man is brought to the emergency department after ingesting an entire bottle of acetaminophen. Over the next 48 hours, his AST and ALT levels rise to >5,000 U/L. Hepatocyte necrosis in this patient will initially localize to which of the following anatomic areas of the liver?",
                options: {
                    A: "Centrilobular regions (Zone 3)",
                    B: "Mid-zonal regions (Zone 2)",
                    C: "Periportal regions (Zone 1)",
                    D: "Portal tracts",
                    E: "Space of Disse"
                },
                correctAnswer: "A",
                rationale: "Acetaminophen toxicity causes acute/fulminant hepatic failure. Coagulative necrosis begins in the centrilobular regions (Zone 3) due to the high prevalence of CYP-450 enzymes here, which metabolize the drug into toxic intermediates.",
                source: "Pathology of the Liver PDF, Slide 19: 'Acute/ Fulminant Hepatic Failure (example= acetaminophen)... Coagulative Necrosis- begins in centrilobular regions (zone 3) due to high prevalence of CYP-450 enzymes here'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Toxic Injury - Aspirin).",
                question: "A 3-year-old boy is brought to the emergency department with vomiting, lethargy, and hepatomegaly. His parents state he recently had a viral illness (influenza B) and was given aspirin for a fever. If a liver biopsy were performed, which of the following is the hallmark histologic finding for this patient's condition?",
                options: {
                    A: "Ballooning degeneration",
                    B: "Ground-glass hepatocytes",
                    C: "Macrovesicular steatosis",
                    D: "Microvesicular steatosis",
                    E: "Mallory-Denk bodies"
                },
                correctAnswer: "D",
                rationale: "Reye syndrome occurs in children given aspirin for viral illnesses (VZV, influenza B). Due to mitochondrial damage of hepatocytes, the hallmark histologic finding is microvesicular steatosis (fat globules smaller than the hepatocyte nucleus).",
                source: "Pathology of the Liver PDF, Slide 20: 'Reye syndrome • Children < 4-years-old • Aspirin taken for a viral illness... Hallmark is microvesicular steatosis'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Fatty Liver Disease - Alcohol).",
                question: "A 55-year-old man with a long history of heavy alcohol consumption is found to have an enlarged, yellow, soft, and greasy liver on autopsy. The pathogenesis of this steatosis involves the depletion of which of the following molecules, causing a shift towards fatty acid biosynthesis?",
                options: {
                    A: "ATP7B",
                    B: "Glutathione",
                    C: "NAD+",
                    D: "Prothrombin",
                    E: "UDP glucuronyl transferase"
                },
                correctAnswer: "C",
                rationale: "Alcohol metabolism by ADH and ALDH depletes NAD+. Because NAD+ is required for fatty acid oxidation, this depletion decreases catabolism and shifts processes toward fatty acid biosynthesis, resulting in fat accumulation in the liver.",
                source: "Pathology of the Liver PDF, Slide 34: 'Alcohol causes buildup of triglycerides via multiple mechanisms • ADH and ALDH deplete NAD+ • NAD+ required for fatty acid (FA) oxidation • Decreased catabolism, shifting processes towards FA biosynthesis'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Fatty Liver Disease - Non-alcohol/MASLD).",
                question: "A 48-year-old woman with a BMI of 34 kg/m ² and type II diabetes mellitus is evaluated for chronically elevated AST and ALT levels. She reports drinking no alcohol. A liver biopsy shows steatohepatitis. Which of the following patient factors is the best predictor of severe fibrosis and disease progression in her condition?",
                options: {
                    A: "Elevated levels of serum ferritin",
                    B: "Presence of autoantibodies (ANA, ASMA)",
                    C: "Presence of diabetes mellitus and obesity",
                    D: "Pronounced microvesicular steatosis",
                    E: "Viral hepatitis coinfection"
                },
                correctAnswer: "C",
                rationale: "In Metabolic-dysfunction Associated Steatohepatitis (MASH), the presence of Type II Diabetes Mellitus (DM II) and obesity is the best predictor of severe fibrosis and disease progression.",
                source: "Pathology of the Liver PDF, Slide 42: 'Metabolic-dysfunction Associated Steatohepatitis (MASH) • The presence of DM II and obesity is the best predictor of severe fibrosis and disease progression'"
            },
            {
                section: "Pathology of the Liver",
                fullLO: "LO3: Discuss the clinicopathologic aspects of liver pathology due to a variety of etiologies (Autoimmune - Primary Biliary Cholangitis).",
                question: "A 45-year-old woman presents with severe fatigue, pruritus, and obstructive jaundice. Laboratory testing reveals high titers of anti-mitochondrial antibodies (AMA). A liver biopsy is most likely to show which of the following?",
                options: {
                    A: "\"Chicken wire\" fibrosis around central veins",
                    B: "Concentric \"onion-skinning\" around bile ducts",
                    C: "Florid duct lesions with granulomas",
                    D: "Prominent plasma cell infiltrates in the portal tract",
                    E: "Shrunken hepatocytes with intensely eosinophilic cytoplasm"
                },
                correctAnswer: "C",
                rationale: "Primary Biliary Cholangitis (PBC) predominantly affects women aged 40-50, is characterized by AMA positivity, and histologically shows autoimmune granulomatous destruction of intrahepatic bile ducts (florid duct lesions).",
                source: "Pathology of the Liver PDF, Slide 47-48: 'Primary Biliary Cholangitis... 90% have high titers of anti-mitochondrial antibodies (AMA)... Granulomas (florid duct lesion)'"
            },

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Pathology of the Liver")) btnText = "Liver Pathology";
                    if (btnText.includes("Biliary and Pancreas Pathology")) btnText = "Biliary/Pancreas Pathology";
                    if (btnText.includes("Diagnosis and Management of Pancreatic Disorders")) btnText = "Pancreatic Disorders";
                    if (btnText.includes("Pharmacogenomics")) btnText = "Pharmacogenomics";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
